baseURL = "https://bjk001ai.github.io/hugo-blog/"
defaultContentLanguage = "ko"
languageCode = "ko-kr"
hasCJKLanguage = true
title = "Dev.log 👨‍💻"
theme = "PaperMod"

[pagination]
  pagerSize = 5

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  env = "production"
  DateFormat = "2006년 1월 2일"
  description = "JavaScript, CS, 웹 개발 공부를 기록하는 개발 블로그입니다."
  defaultTheme = "auto"
  disableLangToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = "안녕하세요, Dev.log 입니다 👋"
    Content = """
개발 공부를 기록하는 블로그입니다.  
JavaScript, CS 지식, 웹 개발 등 다양한 주제를 다룹니다.  
꾸준히, 깊게, 함께 성장해요 🚀
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/bjk001ai"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "글 목록"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "tags"
    name = "태그"
    url = "/tags/"
    weight = 2
  [[menu.main]]
    identifier = "about"
    name = "소개"
    url = "/about/"
    weight = 3
